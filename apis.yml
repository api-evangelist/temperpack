aid: temperpack
name: TemperPack
description: 'TemperPack is a Richmond, Virginia based sustainable packaging manufacturer,
  founded in 2015 and a Certified B Corporation, that designs and manufactures curbside
  recyclable and compostable alternatives to expanded polystyrene (EPS) and single-use
  plastic for cold chain and protective shipping. Its three material platforms are
  ClimaCell, a starch-and-paper thermal liner for cold chain shipments; Green Cell
  Foam, a certified compostable starch-based insulation with EPS-level performance;
  and WaveKraft, paper-based cushioning produced on demand. Products span cushioning,
  mailers, qualified shippers and stock shippers, serving life sciences, food and beverage,
  pet and veterinary, wine, and packaging distribution customers from ISO 9001:2015
  certified plants in Richmond VA, Lansing MI and Las Vegas NV, with in-house ISTA
  thermal and mechanical testing at its Proving Ground lab. TemperPack operates a customer
  portal for order tracking, thermal testing results, billing and WaveKraft analytics,
  and an e-commerce store, but publishes no public developer API, OpenAPI definition
  or developer portal as of August 2026.'
